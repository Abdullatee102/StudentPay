[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
    "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./" }]

[rpc_endpoints]
bohr_testnet = "${BOHR_RPC_URL}"

[etherscan]
# Bohr Testnet explorer (blockscout-compatible)
bohr_testnet = { key = "verifycontract", url = "https://scan.bohr.life/api" }

